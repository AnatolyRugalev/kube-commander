# golangci-lint configuration for kubecom.
#
# The legacy 2020 trees (app/, cli/, commander/, config/, pb/, cmd/kube-commander/)
# were deleted from v1 up-front (D14), so no path excludes are needed: every
# package under this module is new rewrite code and is linted. Ruleset starts
# lenient (the standard linters) per M0 and is tightened later.
version: "2"

linters:
  default: standard

formatters:
  enable:
    - gofmt

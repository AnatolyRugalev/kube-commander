# goreleaser config for kubecom — Linux + macOS only (D7); no kubectl runtime
# dependency (D2). M0-06 is the release skeleton; distribution (Homebrew tap,
# AUR) is wired and verified in M5. Container builds were dropped on 2026-08-09
# (D254).
version: 2

before:
  hooks:
    - go mod download

builds:
  - id: kubecom
    main: ./cmd/kubecom
    binary: kubecom
    env:
      - CGO_ENABLED=0
    # Every exported var in internal/version must be set here, or the released
    # binary reports a placeholder ("commit none, built unknown") that a bug
    # report then quotes — and a shipped tag cannot be rebuilt (D173 pt 1).
    # TestGoreleaserSetsAllVersionVars is the drift guard.
    ldflags:
      - -s -w
      - -X github.com/neuroplastio/kubecom/internal/version.Version={{ .Version }}
      - -X github.com/neuroplastio/kubecom/internal/version.Commit={{ .FullCommit }}
      - -X github.com/neuroplastio/kubecom/internal/version.Date={{ .Date }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: release
    ids:
      - kubecom
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
  - id: binaries
    ids:
      - kubecom
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary

release:
  ids:
    - release
    - binaries

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

# Release notes, generated from the git log between the previous tag and this one.
# The M5-10 pre-flight rendered them for real (a local `v1.0.0-rc.1`, `goreleaser
# release --skip=publish`) rather than reasoning about them, and found the filters
# below were matching almost nothing — see D185 pt 1.
changelog:
  sort: asc
  # Drop the commit SHA from each line: it is 40 characters of noise ahead of the
  # only part a reader is scanning, and the GitHub release body links every PR and
  # commit anyway.
  abbrev: -1
  filters:
    exclude:
      # The `(\(.+\))?` is load-bearing, not defensive. Every commit in this repo
      # is *scoped* (`chore(board): claim M5-08`, `docs(screencast): …`), which
      # `^chore:` does not match — so before this fix the first release's notes
      # opened with ~180 board-claim lines and buried the features under them.
      - '^chore(\(.+\))?:'
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^build(\(.+\))?:'
      - '^style(\(.+\))?:'
      - '^refactor(\(.+\))?:'
      # An abandoned experiment and its revert say nothing to a user; both are
      # in this history (`wip(M0-02)` / `Revert "wip(M0-02)…"`).
      - '^wip(\(.+\))?:'
      - '^Revert '
      - '^Merge '
      # `feedback:` and `dogfood …` are this project's vault bookkeeping: the
      # maintainer filing a report or a dogfood result (D69/D79). The change that
      # answers one is its own `feat:`/`fix:` commit, so keeping these would list
      # every issue twice — once as reported, once as fixed.
      - '^feedback(\(.+\))?:'
      - '^dogfood '
  # `feat`/`fix` are the two types a release reader scans for; everything else
  # that survives the filters (`perf:`, `feedback:` — the type this repo uses for
  # maintainer-reported changes) lands in the catch-all rather than disappearing.
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: Other changes
      order: 999

# Homebrew (M5-06/D182). A **cask**, not a formula: `brews:` is deprecated in
# goreleaser v2 and `goreleaser check` now fails on it, and Homebrew's own policy
# is that a pre-compiled binary belongs in a cask. Consequence to keep in mind:
# casks are **macOS-only** — `brew` on Linux refuses to install one — even though
# goreleaser still emits the `on_linux` stanzas below from the Linux archives.
# Linux users get the tarball, the AUR package (M5-07) or `go install`.
#
# The tap is the org-level `neuroplastio/homebrew-tap` (`brew tap
# neuroplastio/tap` — a repo named `homebrew-tap` taps as `owner/tap`),
# created by the release-namespace fold-in 2026-08-09
# (D253) as the home for every neuroplastio tool, kubecom the first. It replaces
# the 2020 `AnatolyRugalev/homebrew-kubecom` tap deliberately: that tap keeps
# serving the 2020 formula to anyone still on the old address, with no redirect
# (the acknowledged cost of moving a tap). The org tap is new, so it holds no
# 2020 formula to delete — the stale-formula seatbelt D182 pt 2 required is moot
# here.
homebrew_casks:
  - name: kubecom
    ids:
      - release
    # `binaries` (plural), not the deprecated singular `binary`; and no `license`
    # key, which goreleaser accepts but never renders — a cask has no license
    # stanza. `goreleaser check` in CI is what keeps both honest.
    binaries:
      - kubecom
    homepage: "https://github.com/neuroplastio/kubecom"
    description: "Fast, vim-friendly, zero-deploy Kubernetes terminal UI"

    # Inert without its secret (D173 pt 2, D182 pt 3). goreleaser evaluates
    # skip_upload as a template and checks it *before* it touches the token, so
    # a release run with no HOMEBREW_TAP_TOKEN skips the cask and still publishes
    # everything else. Without this the publisher would fall back to the
    # workflow's own GITHUB_TOKEN, which cannot write to the tap repo, and a
    # release that cannot be retried would fail at the last step.
    # `index .Env` (not `.Env.X`) is deliberate: it yields "" for an absent key
    # instead of erroring, so unset and set-but-empty behave the same — which is
    # what GitHub Actions produces for a secret that does not exist.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: neuroplastio
      name: homebrew-tap
      # branch omitted on purpose: goreleaser then uses the tap's default branch,
      # which beats guessing master vs main for a repo created in 2020.
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'

    # NOTE: there is deliberately no `conflicts:` entry. A cask can only declare
    # conflicts with other *casks* — goreleaser drops `conflicts.formula`
    # silently (deprecated *and* never rendered) — but the org tap (D253) is new
    # and empty, so the 2020-formula collision that made D182 pt 2 a seatbelt
    # cannot occur here. If a formula ever appears in `neuroplastio/homebrew-tap`,
    # Homebrew resolves a bare name to it in preference to this cask, and it must
    # be removed by hand — the same failure shape, guarded by nothing.

    # goreleaser builds unsigned, un-notarized darwin binaries, so macOS attaches
    # a quarantine attribute on download and Gatekeeper kills the binary on first
    # run. Stripping it is what makes `brew install --cask` actually yield a
    # runnable kubecom (D182 pt 4).
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kubecom"]
          end

# AUR (M5-07/D183). A `-bin` package built from the released linux archives, so
# an Arch user installs the same artifact the tarball ships instead of compiling
# it — kubecom needs no Go toolchain on the user's machine.
#
# The package name is **not** the 2020 one, and that is forced, not chosen.
# `master:ci/aur/publish.sh` pushed to `aur@aur.archlinux.org:kube-commander`,
# but goreleaser's aur pipe appends `-bin` to any name lacking it
# (internal/pipe/aur/aur.go, Default), and the AUR requires `pkgbase` to equal
# the repository name — so this config *cannot* write to `kube-commander`. The
# new package is `kubecom-bin`, and the 2020 one has to be retired by hand:
# human task `2026-07-30-aur-package-access`.
aurs:
  - name: kubecom # goreleaser makes this `kubecom-bin`; git_url below must match
    # Restricted to the tar.gz archive on purpose. Without `ids` the pipe also
    # matches the `binaries` archive, which has the same GOOS/GOARCH pair, and
    # the PKGBUILD would carry two `source_x86_64=` lines — the second silently
    # overwriting the first.
    ids:
      - release
    homepage: "https://github.com/neuroplastio/kubecom"
    description: "Fast, vim-friendly, zero-deploy Kubernetes terminal UI"
    # Apache-2.0, per this repo's LICENSE. The 2020 PKGBUILD said MIT; the
    # repository has carried the Apache license since before that package was
    # published, so it was simply wrong and is not something to preserve.
    license: "Apache-2.0"
    maintainers:
      - "Anatoly Rugalev <anatoly.rugalev@gmail.com>"

    # No `depends`. The 2020 package declared `depends=('kubectl')`; kubecom
    # talks to the apiserver through client-go and shells out to nothing (D2),
    # so requiring kubectl would pull in a dependency the binary never uses.
    # Stated as a comment rather than omitted silently, because an empty
    # `depends` looks like an oversight and this one is the whole point of D2.

    # `provides`/`conflicts` are set explicitly; goreleaser otherwise defaults
    # both to the *project* name (`kube-commander`), which would advertise this
    # package as providing a `kube-commander` binary it does not install.
    provides:
      - kubecom
    conflicts:
      - kubecom
      # The 2020 `kube-commander` package installs its own `/usr/bin/kubecom`.
      # Unlike the Homebrew cask — where `conflicts.formula` is accepted and
      # dropped on the floor (D182 pt 2) — pacman honours this, so the two
      # packages cannot be co-installed and a user upgrading gets a clear
      # conflict instead of one binary silently overwriting the other. It is a
      # real seatbelt, but not a migration: the AUR has no `replaces`, and
      # goreleaser exposes no such field, so retiring the old package is a
      # human step.
      - kube-commander

    # Explicit rather than inferred. goreleaser guesses this from the archive
    # and logs `guessing package to be …`; spelling it out keeps the installed
    # path visible in review. Only `kubecom` is installed — the 2020 package
    # also shipped `kube-commander` and `kubectl-ui` shell shims that re-exec
    # the binary, and both are dropped (D183).
    package: |-
      install -Dm755 "./kubecom" "${pkgdir}/usr/bin/kubecom"

    # Inert without its secret (D173 pt 2), the same property the cask has and
    # for the same reason — but note the failure mode differs: an empty
    # `private_key` only skips *after* the pipe has run, and an empty `git_url`
    # skips with a message about a URL. Conditioning skip_upload on the secret
    # is what makes the skip explicit and first, before any of that.
    skip_upload: '{{ if index .Env "AUR_SSH_PRIVATE_KEY" }}false{{ else }}true{{ end }}'
    private_key: '{{ index .Env "AUR_SSH_PRIVATE_KEY" }}'
    # Required, and it has no default: goreleaser skips the publish entirely
    # ("url is empty") if this is unset, which looks like success. The `-bin`
    # suffix must be written out here because goreleaser appends it to `name`
    # but never to this URL.
    git_url: "ssh://aur@aur.archlinux.org/kubecom-bin.git"
    # git_ssh_command left at goreleaser's default, which is
    # `ssh -i "{{ .KeyPath }}" -o StrictHostKeyChecking=accept-new -F /dev/null`.
    # The 2020 script used `StrictHostKeyChecking=no` with `UserKnownHostsFile=
    # /dev/null`; accept-new is strictly better and needs no configuration.

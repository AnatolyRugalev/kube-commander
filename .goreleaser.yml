before:
  hooks:
    - go mod download
builds:
  - id: kubecom-linux
    main: ./cmd/kubecom
    binary: kubecom
    ldflags:
      - -s -w -X github.com/AnatolyRugalev/kube-commander/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
  - id: kubecom-darwin
    main: ./cmd/kubecom
    binary: kubecom
    ldflags:
      - -s -w -X github.com/AnatolyRugalev/kube-commander/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
  - id: kubecom-windows
    main: ./cmd/kubecom
    binary: kubecom
    ldflags:
      - -s -w -X github.com/AnatolyRugalev/kube-commander/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
archives:
  - id: release
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - kubecom-linux
      - kubecom-windows
      - kubecom-darwin
  - id: binaries
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: binary
    builds:
      - kubecom-linux
      - kubecom-windows
      - kubecom-darwin
  - id: aur
    name_template: "aur_{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - kubecom-linux
release:
  ids:
    - release
    - binaries
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
publishers:
  - name: aur
    ids:
      - aur
    cmd: ci/aur/publish.sh {{ .Version }}
brews:
  - name: kubecom
    folder: Formula
    homepage: "https://github.com/AnatolyRugalev/kube-commander"
    description: "kubecom is terminal UI for easy interaction with Kubernetes"
    url_template: "https://github.com/AnatolyRugalev/kube-commander/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    skip_upload: false
    ids:
      - release
    tap:
      owner: AnatolyRugalev
      name: homebrew-kubecom
    commit_author:
      name: goreleaserbot
      email: goreleaser@carlosbecker.com
    dependencies:
      - name: kubectl

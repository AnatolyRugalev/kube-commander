# goreleaser config for kubecom — Linux + macOS only (D7); no kubectl runtime
# dependency (D2). M0-06 is the release skeleton; distribution (Homebrew tap,
# AUR, Docker) is wired and verified in M5.
version: 2

before:
  hooks:
    - go mod download

builds:
  - id: kubecom
    main: ./cmd/kubecom
    binary: kubecom
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/AnatolyRugalev/kube-commander/internal/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: release
    ids:
      - kubecom
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
  - id: binaries
    ids:
      - kubecom
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary

release:
  ids:
    - release
    - binaries

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# Publishers (Homebrew, AUR, Docker) are added and verified in M5 — see
# vault/milestones/M5-release.md. This skeleton only builds the Linux+macOS
# artifacts; `brews` is deprecated in goreleaser v2 in favour of Homebrew casks,
# chosen at M5 alongside the tap it needs.

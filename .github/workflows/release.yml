# Release: kubecom's two channels on pkg.neuroplast.io, each build bare binaries
# signed by the release key, which `kubecom update` installs (D18), and beside
# each the thin launcher a package installs as kubecom (D20).
#
#   • dev — every push to main that passes the gate, named YY.MM.DD-dev.<sha7>
#     (the commit's date, UTC).
#   • stable — every tag named for its day, YY.MM.DD, on a commit of main (D21).
#     `make release` pushes one. The tag is the release's name, and it gets a
#     GitHub release with the same files.
#
# Jobs:
#
#   • check — the reusable ci.yml `make check` gate, on main pushes and tags.
#   • build — `make dist`, the eight bare binaries, as a job artifact.
#   • release — on a tag: the GitHub release, a mirror of the channel's files.
#   • publish — after check and build (and release, on a tag): `engram publish`
#     the binaries to the channel, then read the build back through the CDN the
#     way `kubecom update` will.
#   • attach — on a tag: the build's signed manifest to the GitHub release.
#
# There are no secrets. The publish job signs in to AWS with GitHub's OIDC
# token, as a role that may write under kubecom/ in the bucket and sign with the
# release key, and nothing else (neuroplastio/infra; the role trusts main and
# day-named tags). The role, bucket, key and distribution are not secret, so they
# are written here.
name: Release

on:
  push:
    branches: [main]
    tags: ['[0-9][0-9].[0-9][0-9].[0-9][0-9]']

permissions:
  contents: read

env:
  AWS_ROLE_ARN: arn:aws:iam::816026731201:role/github-pkg-publish-kubecom
  BUCKET: neuroplastio-pkg
  KMS_KEY: alias/release-signing
  DISTRIBUTION_ID: E2JRO3ARI7TXDT
  PKG_URL: https://pkg.neuroplast.io
  # The release key's public half, pinned here rather than fetched: it is what
  # the engram installer checks engram against, and what the publish is read
  # back against. kubecom pins the same key in internal/channel.
  ENGRAM_SIGNERS: release@neuroplast.io namespaces="engram" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDCsEZcn1tiubvKQzEVs5pJ4QVXoFmSDtO+k6SdetUdf
  # The channel a build goes to, and how long a superseded build stays on it: a
  # dev build for 30 days, a release for good.
  CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || 'dev' }}
  RETENTION: ${{ github.ref_type == 'tag' && '0' || '720h' }}

jobs:
  check:
    name: make check
    uses: ./.github/workflows/ci.yml

  build:
    name: build the binaries
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # All of main, to tell whether a tag's commit is on it.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # A release is a day — 26.02.30 matches the trigger's pattern and is not
      # one — cut from main, from a commit no other release is.
      - name: Check the tag
        if: ${{ github.ref_type == 'tag' }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$(date -u -d "20${tag//./-}" +%y.%m.%d 2>/dev/null)" != "$tag" ]; then
            echo "::error::$tag is not a day: a release is named YY.MM.DD"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$tag is on $(git rev-parse --short=7 HEAD), which is not on main"
            exit 1
          fi
          other="$(git tag --points-at HEAD --list '[0-9][0-9].[0-9][0-9].[0-9][0-9]' | grep -vx "$tag" || true)"
          if [ -n "$other" ]; then
            echo "::error::$(git rev-parse --short=7 HEAD) is already released as $other"
            exit 1
          fi

      # dist/kubecom_<os>_<arch> and dist/kubecom-launcher_<os>_<arch>: static
      # (CGO off), stamped with the commit, the channel and the build's name —
      # the tag, for a release.
      - run: make dist RELEASE="${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Check the stamp
        run: |
          if [ "$CHANNEL" = stable ]; then
            name="$(echo "$GITHUB_REF_NAME" | sed 's/\./\\./g')"
          else
            name="[0-9][0-9]\.[0-9][0-9]\.[0-9][0-9]-dev\.$(git rev-parse --short=7 HEAD)"
          fi
          dist/kubecom_linux_amd64 version
          dist/kubecom_linux_amd64 version | grep -q "^kubecom $name (commit $(git rev-parse HEAD)"
          test "$(ls dist | wc -l)" -eq 8

      - uses: actions/upload-artifact@v4
        with:
          name: kubecom-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  release:
    name: the GitHub release
    if: ${{ github.ref_type == 'tag' }}
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, to find the release before this one.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: kubecom-${{ github.sha }}
          path: dist/

      # What changed since the previous release on main, the chores left out.
      - name: Write the notes
        run: |
          tag="$GITHUB_REF_NAME"
          commit="$(git rev-parse HEAD)"
          prev="$(git describe --tags --abbrev=0 --match '[0-9][0-9].[0-9][0-9].[0-9][0-9]' HEAD^ 2>/dev/null || true)"
          {
            echo "kubecom $tag is \`$commit\`, published to the stable channel:"
            echo "\`kubecom update\` in a kubecom from this release follows it."
            echo
            if [ -n "$prev" ]; then
              echo "## Since $prev"
              echo
              git log --no-merges --invert-grep --grep='^chore' --format='- %s' "$prev..HEAD"
            else
              echo "The first stable kubecom release."
            fi
            echo
            echo "## Checking the files"
            echo
            echo "These are the files the stable channel holds for this build:"
            echo "\`kubecom_<os>_<arch>\`, the complete binary, and"
            echo "\`kubecom-launcher_<os>_<arch>\`, the thin launcher a package"
            echo "installs as kubecom. \`manifest\` names each one's sha256, and"
            echo "\`manifest.sig\` is the release key's signature over it:"
            echo
            echo '```sh'
            echo "echo '$ENGRAM_SIGNERS' > allowed_signers"
            echo 'ssh-keygen -Y verify -f allowed_signers -I release@neuroplast.io -n engram -s manifest.sig < manifest'
            echo 'grep -w "sha256=$(sha256sum kubecom_linux_amd64 | cut -d" " -f1)" manifest'
            echo '```'
          } > notes.md
          cat notes.md

      - name: Release
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "kubecom $tag" --notes-file notes.md
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" --verify-tag --title "kubecom $tag" --notes-file notes.md dist/*
          fi

  publish:
    name: publish to kubecom/${{ github.ref_type == 'tag' && 'stable' || 'dev' }}
    if: >-
      ${{ !cancelled()
        && needs.check.result == 'success' && needs.build.result == 'success'
        && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    needs: [check, build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job request the OIDC token it signs in to AWS with.
      id-token: write
    concurrency:
      # Never cancel a publishing run: its output leaves the repo.
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kubecom-${{ github.sha }}
          path: dist/

      # The name the binaries carry, read from one of them, so the channel and
      # `kubecom version` can never disagree.
      - name: Name the build
        run: |
          chmod +x dist/*
          echo "KUBECOM_VERSION=$(dist/kubecom_linux_amd64 version | cut -d' ' -f2)" >> "$GITHUB_ENV"

      - name: Install engram
        run: curl -fsS "$PKG_URL/engram/install.sh" | sh -s -- engram ./bin

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Bare binaries, not archives: `kubecom update` puts the file in place of
      # itself. dist/<name>_<os>_<arch> is published as <name>/<os>/<arch>, for
      # kubecom and kubecom-launcher. Idempotent: re-running this job for a
      # commit already in the journal succeeds without doing anything.
      - name: Publish
        run: |
          artifacts=()
          for f in dist/*_*_*; do
            base="${f#dist/}"; name="${base%%_*}"; platform="${base#*_}"
            artifacts+=("$name/${platform%_*}/${platform#*_}=$f")
          done
          bin/engram publish \
            --bucket "$BUCKET" --kms "$KMS_KEY" --cloudfront "$DISTRIBUTION_ID" \
            --project kubecom --channel "$CHANNEL" --retention "$RETENTION" \
            --commit "$(git rev-parse HEAD)" --version "$KUBECOM_VERSION" \
            --time "$(git show -s --format=%cI HEAD)" \
            "${artifacts[@]}"

      # Read it back the way `kubecom update` will: through the CDN, against the
      # pinned key. Three attempts, 10 s then 30 s apart, so a transient CDN
      # error does not fail a release; a build that really does not verify fails
      # all three.
      # --local dist: the signed manifest against the files just built, and the
      # CDN's HEAD and first and last 64 KiB of each against the same files. Not
      # --fetch, which downloads every artifact back through the CDN (about 50 GB
      # in the first half of October 2026, against a 100 GB monthly plan).
      - name: Verify what was published
        run: |
          printf '%s\n' "$ENGRAM_SIGNERS" > allowed_signers
          for attempt in 1 2 3; do
            if bin/engram verify --url "$PKG_URL" --project kubecom --channel "$CHANNEL" \
              --signers allowed_signers --commit "$(git rev-parse HEAD)" --local dist; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt == 1 ? 10 : 30))
              echo "::warning::engram verify failed (attempt $attempt of 3); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::engram verify failed three times"
          exit 1

  # The signed manifest beside the files on the GitHub release, so they can be
  # checked where they were downloaded. It is the build's own, fetched from the
  # channel publish just verified.
  attach:
    name: the manifest to the GitHub release
    if: ${{ github.ref_type == 'tag' }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          build="$PKG_URL/kubecom/stable/builds/$GITHUB_SHA"
          curl -fsS -O "$build/manifest" -O "$build/manifest.sig"
          gh release upload "$GITHUB_REF_NAME" manifest manifest.sig --clobber

  # The AUR package (the launcher plus a seed build, D295): rendered from the
  # release's linux binaries, built with makepkg exactly as a user would, and
  # pushed by packaging/aur/publish.sh. makepkg refuses to run as root and needs
  # base-devel, so the job runs in an Arch container as a non-root user. The one
  # credential is AUR_SSH_PRIVATE_KEY; without it the job skips rather than
  # fails, the way every publisher here degrades.
  aur:
    name: publish kubecom-bin to the AUR
    if: ${{ github.ref_type == 'tag' }}
    needs: [publish]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh curl libarchive zstd

      - name: Publish
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          RELEASE: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; skipping the AUR publish"
            exit 0
          fi
          dir=/tmp/release
          mkdir -p "$dir"
          for f in kubecom-launcher_linux_amd64 kubecom-launcher_linux_arm64 \
                   kubecom_linux_amd64 kubecom_linux_arm64; do
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE/$f" -o "$dir/$f"
          done

          # makepkg refuses to run as root; the publish is its whole build.
          id -u builder >/dev/null 2>&1 || useradd -m builder
          install -d -m700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          chown builder:builder /home/builder/.ssh/aur
          chown -R builder:builder "$dir"
          ssh-keyscan -t ed25519 aur.archlinux.org > /home/builder/.ssh/known_hosts 2>/dev/null || true
          chown builder:builder /home/builder/.ssh/known_hosts

          su builder -s /bin/sh -c "cd '$GITHUB_WORKSPACE' && \
            GIT_SSH_COMMAND='ssh -i /home/builder/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=/home/builder/.ssh/known_hosts' \
            packaging/aur/publish.sh '$RELEASE' '$dir' --push"

  # The Homebrew formula (the launcher plus a seed build, D295), rendered from
  # the release's binaries and pushed to the org tap `neuroplastio/homebrew-tap`.
  # The tap is a different repository, so this needs HOMEBREW_TAP_TOKEN (a token
  # that may write to it); without it the job skips, like every publisher here.
  homebrew:
    name: publish the Homebrew formula
    if: ${{ github.ref_type == 'tag' }}
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # All tags, so the release tag resolves to its commit.
          fetch-depth: 0

      - name: Publish
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew publish"
            exit 0
          fi
          packaging/homebrew/publish.sh "$RELEASE" --push
